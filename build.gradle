/*
 * Gradle build for the Open Integration Engine.
 *
 * Replaced the historical Ant build in June 2026 with verified output
 * parity: server/setup is the assembled distribution, server/dist holds
 * the extension zips, and every archive's entry contents were verified
 * byte-identical against an Ant baseline (reproducible with the
 * oie-build-parity tooling). The only
 * differences are archive metadata: Gradle normalizes zip entry
 * timestamps to its fixed epoch (the Ant build used archive.entry.date
 * for the same purpose), orders entries deterministically, and does not
 * write the Ant-Version manifest attribute.
 *
 * Dependencies resolve from Maven Central via gradle/libs.versions.toml;
 * every coordinate was SHA-1 matched to the previously vendored jar,
 * resolution is non-transitive so the artifact set stays exactly the
 * audited set, and gradle/verification-metadata.xml enforces checksums
 * on every resolution. The
 * verifyVendoredParity task guards distribution placement
 * (gradle/vendored-layout.json). Unmatched jars remain vendored in the
 * module lib/ directories.
 *
 * Differences in full: no Ant-Version/Created-By manifest attributes,
 * normalized entry timestamps and ordering, no timestamp comment in
 * version.properties, one extra directory entry in mirth-client.jar
 * and mirth-server.jar, and the empty package-info.class markers Ant's
 * javac emitted for the three annotation-free package-info.java sources
 * are not reproduced (inert, no runtime effect).
 *
 * Usage (build flags are Gradle project properties, -Pname=true):
 *   ./gradlew build                          full build + tests
 *   ./gradlew build -PdisableTests=true      skip tests
 *   ./gradlew build -PdisableSigning=true    skip jar signing
 *   ./gradlew test [-Pcoverage=true]         tests only (JaCoCo optional)
 *   ./gradlew dist                           distribution extension zips
 *   ./gradlew clean                          clean all modules
 *
 * For release artifacts run a clean build (./gradlew clean build dist):
 * the staging into server/setup removes stale files where it owns the
 * directory, but artifacts renamed or removed from intermediate build
 * directories are only guaranteed gone after a clean.
 */

plugins {
    // vulnerability scanning: ./gradlew dependencyCheckAggregate
    // (replaces the old standalone dependency-check.xml Ant entry point)
    alias(libs.plugins.owasp.dependencycheck)
}

dependencyCheck {
    // NVD downloads are heavily throttled without a key; get one at
    // https://nvd.nist.gov/developers/request-an-api-key
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
    // the distribution ships no .NET assemblies, and the analyzer
    // hard-fails the whole scan on machines without a dotnet runtime
    analyzers {
        assemblyEnabled = false
    }
    // also scan the jars that remain vendored (no Maven coordinates)
    scanSet = subprojects.collect { it.file('lib') }.findAll { it.directory }
}

// Build flags are passed as Gradle project properties: -Pname=true.
def flag = { String name ->
    providers.gradleProperty(name).getOrNull() == 'true'
}

ext {
    disableTests = flag('disableTests')
    disableSigning = flag('disableSigning')
    coverageEnabled = flag('coverage')
}

allprojects {
    group = 'org.openintegrationengine'
    // default comes from gradle.properties; -Pversion=x.y.z overrides
    version = providers.gradleProperty('version').getOrNull() ?: version
}

// Maps each Maven Central artifact ("group:artifact") to the directory
// its vendored copy lived in, so the staged distribution layout matches
// what the vendored build produced. Version-independent: bumping a
// version in libs.versions.toml needs no layout change; only a NEW
// distributed artifact needs a placement line (the build fails with a
// clear message if one is missing).
ext.vendoredLayout = file('gradle/vendored-layout.json').exists()
        ? new groovy.json.JsonSlurper().parse(file('gradle/vendored-layout.json'))
        : [:]

// Maps a resolved-artifact inventory to {source File -> staged relative
// path} using the placement map. fileTree(lib) leftovers and project
// outputs are excluded naturally: they are not module components.
ext.placementsFor = { List inventory, String section, Closure dirFilter = { true } ->
    def placements = rootProject.vendoredLayout[section] ?: [:]
    def out = [:]
    inventory.each { art ->
        def entry = placements["${art.group}:${art.module}".toString()]
        if (entry == null) {
            return
        }
        // entry is either a directory string, or [dir:, file:] when the
        // vendored copy carried a non-canonical file name (a version bump
        // of such an artifact must revisit the pinned file name)
        def dir = entry instanceof Map ? entry.dir : entry
        if (!dirFilter(dir)) {
            return
        }
        def name = entry instanceof Map ? entry.file : art.fileName
        out[file(art.path)] = (dir ? "${dir}/" : '') + name
    }
    out
}

// Lazily computes placements from a configuration RESOLVED IN THE CALLING
// PROJECT'S OWN CONTEXT. Never pass another project's configuration here
// (cross-project resolution is deprecated and fails in Gradle 9); consume
// the other project's placement manifest instead.
ext.stagedArtifacts = { configuration, String section, Closure dirFilter = { true } ->
    def memo = null
    return {
        if (memo == null) {
            def inventory = []
            configuration.incoming.artifacts.each { a ->
                def id = a.id.componentIdentifier
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    inventory << [group: id.group, module: id.module,
                                  fileName: a.file.name, path: a.file.absolutePath]
                }
            }
            memo = rootProject.placementsFor(inventory, section, dirFilter)
        }
        memo
    }
}

// Reads the artifact inventory another project wrote with its own
// writeArtifactInventory task (the Gradle-9-safe replacement for
// resolving that project's configuration from here).
ext.stagedFromInventory = { File inventoryFile, String section, Closure dirFilter = { true } ->
    def memo = null
    return {
        if (memo == null) {
            def inventory = new groovy.json.JsonSlurper().parse(inventoryFile)
            memo = rootProject.placementsFor(inventory, section, dirFilter)
        }
        memo
    }
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // The dependency set must remain exactly the vendored jar set; the
    // coordinates were derived from SHA-1 matches of the vendored jars,
    // so transitive resolution would ADD artifacts the build never had.
    // Revisit (enable transitivity, drop pins) as a deliberate follow-up.
    ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
        configurations.named(name) { transitive = false }
    }

    dependencies {
        // jars without a byte-identical Maven Central artifact stay vendored
        implementation fileTree(dir: 'lib', include: '**/*.jar')
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.debug = true
    }

    // Legacy modules assemble their published archives explicitly. 
    // Newer modules use Gradle's normal JAR convention.
    if (project.name in ['donkey', 'server', 'client', 'command', 'generator']) {
        tasks.named('jar') { enabled = false }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    // Gradle-9-safe cross-project artifact sharing: each project resolves
    // its OWN runtime configuration and writes an inventory file; consumer
    // projects read the file instead of resolving foreign configurations.
    def inventoryFile = layout.buildDirectory.file('placement/artifacts.json')
    tasks.register('writeArtifactInventory') {
        description = 'Records this project\'s resolved runtime artifacts to build/placement/artifacts.json so ' +
                ':server:stageSetup can place foreign-module jars without resolving their configurations cross-project (Gradle-9-safe).'
        def cfg = configurations.runtimeClasspath
        dependsOn cfg
        outputs.file inventoryFile
        outputs.upToDateWhen { false }
        doLast {
            def inventory = []
            cfg.incoming.artifacts.each { a ->
                def id = a.id.componentIdentifier
                if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                    inventory << [group: id.group, module: id.module, version: id.version,
                                  fileName: a.file.name, path: a.file.absolutePath]
                }
            }
            def f = inventoryFile.get().asFile
            f.parentFile.mkdirs()
            f.text = groovy.json.JsonOutput.toJson(inventory)
        }
    }

    tasks.register('verifyDistributionPlacement') {
        description = 'Fails if any resolved runtime artifact lacks a distribution placement.'
        def cfg = configurations.runtimeClasspath
        dependsOn cfg
        doLast {
            def layoutMap = rootProject.vendoredLayout
            def sections = (project.name in ['server', 'client']) ? [project.name, 'server-extensions'] : [project.name]
            def missing = []
            int checked = 0
            cfg.incoming.artifacts.each { a ->
                def id = a.id.componentIdentifier
                if (!(id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) {
                    return
                }
                def ga = "${id.group}:${id.module}".toString()
                if (sections.any { (layoutMap[it] ?: [:]).containsKey(ga) }) {
                    checked++
                } else {
                    missing << "${ga}:${id.version} (${a.file.name})"
                }
            }
            logger.lifecycle "${project.name}: distribution placement verified for ${checked} artifacts"
            if (!missing.isEmpty()) {
                throw new GradleException('Resolved runtime artifacts with no entry in ' +
                        'gradle/vendored-layout.json (they would be dropped from the staged ' +
                        'distribution):\n  ' + missing.unique().join('\n  '))
            }
        }
    }

    tasks.withType(Test).configureEach {
        onlyIf { !rootProject.disableTests }
        useJUnit()
        minHeapSize = '128m'
        maxHeapSize = '2048m'
        jvmArgs '-Xshare:off'
        include '**/*Test.class'
        /*
         * Past ~4 forks the per-fork JVM startup cost (inflated by -Xshare:off above) outweighs the
         * gain, since only a handful of classes take more than a second. Override with -PtestForks=N.
         */
        maxParallelForks = (project.findProperty('testForks') ?: Math.max(1, Math.min(4, Runtime.runtime.availableProcessors().intdiv(2)))) as int
    }

    if (rootProject.coverageEnabled) {
        apply plugin: 'jacoco'
        jacoco { toolVersion = '0.8.8' }
        tasks.withType(Test).configureEach { finalizedBy tasks.named('jacocoTestReport') }
        tasks.named('jacocoTestReport') {
            reports.xml.required = true
            reports.html.required = true
        }
    }
}

// ---------------------------------------------------------------------
// Top-level lifecycle, mirroring server/mirth-build.xml
// ---------------------------------------------------------------------

// After the setup tree is assembled (and possibly signed), the Ant build
// copied the final extensions and client-lib back into server/build for
// downstream packaging (installers, CI artifacts). Untracked because the
// destinations overlap the extension build outputs.
def copyFinalArtifactsBack = tasks.register('copyFinalArtifactsBack') {
    description = 'Copies the final (possibly signed) extensions and client-lib back into server/build.'
    dependsOn ':server:createSetup'
    outputs.upToDateWhen { false }
    doLast {
        sync { s ->
            s.from 'server/setup/extensions'
            s.into 'server/build/extensions'
        }
        sync { s ->
            s.from 'server/setup/client-lib'
            s.into 'server/build/client-lib'
        }
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds donkey, the server and its extensions, the client, and the CLI, then assembles server/setup.'
    dependsOn ':donkey:assemble', ':command:assemble', ':server:createSetup',
            copyFinalArtifactsBack, 'verifyVendoredParity'
    if (!rootProject.disableTests) {
        dependsOn ':donkey:test', ':server:test', ':client:test', ':command:test'
    }
}

tasks.register('dist') {
    group = 'build'
    description = 'Builds everything and creates the distribution extension zips in server/dist.'
    dependsOn ':server:createExtensionZips'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs the unit tests of every module (pass -Pcoverage=true for JaCoCo).'
    dependsOn ':donkey:test', ':server:test', ':client:test', ':command:test'
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans every module.'
    dependsOn ':donkey:clean', ':server:clean', ':client:clean', ':command:clean', ':generator:clean'
}

// Aggregate: the per-project checks resolve each configuration in its
// OWNING project's context (Gradle-9-safe; no cross-project resolution).
tasks.register('verifyVendoredParity') {
    group = 'verification'
    description = 'Verifies every resolved runtime artifact has a distribution placement ' +
            '(checksums are enforced separately by gradle/verification-metadata.xml).'
    dependsOn subprojects.collect { ":${it.name}:verifyDistributionPlacement" }
}

// Note: the Ant build's append-license target was already broken at the
// time of the migration (no jar in the repository contains
// com.mirth.tools.header.HeaderTask), so it was not ported.

//INSTALLERS
tasks.register('prepareServerBundle') {
    dependsOn ':server:stageSetup',
              ':server:serverJar',
              ':server:launcherJar',
              ':server:cryptoJar',
              ':server:clientCoreJar',
              ':server:userutilSourcesJar',
              ':server:dbconfJar'
    description = 'Compile JARs from server and prepares directory server/setup.'
}
// tar.gz package 
tasks.register('distPackage', Exec) {
    group = 'distribution'
    description = 'Generates portable package with jpackage in .tar.gz format'
    dependsOn 'prepareServerBundle'

    def outputDir = layout.buildDirectory.dir("distributions").get().asFile
    def distDir = file("${buildDir}/tmp/pkg")
    def appDir = file("${distDir}/openintegrationengine")
    def stagingInput = file("${buildDir}/tmp/pkg-input")
    def scriptsDir = file("${rootDir}/server/distribution")
    def setupDir = file("${rootDir}/server/setup")
    def versionStr = (project.findProperty('version') && project.version != 'unspecified') ? project.version : "4.7.0"
    def outTarGz = file("${outputDir}/openintegrationengine-${versionStr}-linux-x64.tar.gz")

    outputs.file(outTarGz)

    doFirst {
        outputDir.mkdirs()
        outTarGz.delete()
        delete distDir
        delete stagingInput
        distDir.mkdirs()

        // Prepares clean entry without Windows artifacts or distribution folders
        copy {
            from(setupDir)
            into(stagingInput)
            exclude 'distribution/**', '*.exe', '*.bat', '*.ps1', 'oieservice*'
        }
    }

    commandLine 'sh', '-c', """
        set -e
        # 1. Create jpackage app-image with bundled runtime
        jpackage \
          --type app-image \
          --name "openintegrationengine" \
          --app-version "${versionStr}" \
          --input "${stagingInput.absolutePath}" \
          --main-jar "mirth-server-launcher.jar" \
          --main-class "com.mirth.connect.server.launcher.MirthLauncher" \
          --java-options "-server -Xmx256m -Djava.awt.headless=true -Ddir.base=\\\$APPDIR --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.desktop/java.awt.font=ALL-UNNAMED" \
          --dest "${distDir.absolutePath}"

        # 2. Inject Unix scripts and oiecommand CLI wrapper (using bundled jpackage runtime)
        cp "${scriptsDir}"/tar/*.sh "${appDir}/"
        cat << 'EOF' > "${appDir}/oiecommand"
#!/usr/bin/env bash
SCRIPT_PATH="\$(readlink -f "\$0" 2>/dev/null || realpath "\$0" 2>/dev/null || echo "\$0")"
DIR_BASE="\$(cd "\$(dirname "\$SCRIPT_PATH")" && pwd)"
cd "\$DIR_BASE/lib/app"
exec "\$DIR_BASE/lib/runtime/bin/java" -jar "\$DIR_BASE/lib/app/mirth-cli-launcher.jar" "\$@"
EOF
        chmod +x "${appDir}"/*.sh "${appDir}/oiecommand"

        # 3. Compress distribution directly into build/distributions
        tar -czf "${outTarGz.absolutePath}" -C "${distDir.absolutePath}" openintegrationengine
        echo "Package generated in: ${outTarGz.absolutePath}"
    """

    doLast {
        delete distDir
        delete stagingInput
    }
}
// Debian/Ubuntu native installer .deb
tasks.register('distDeb', Exec) {
    group = 'distribution'
    description = 'Generates a Debian/Ubuntu native installer .deb with systemd support'
    dependsOn 'prepareServerBundle'

    def outputDir = layout.buildDirectory.dir("distributions").get().asFile
    def resourcesDir = file("${project(':server').projectDir}/distribution/linux/deb")
    def setupDir = file("${project(':server').projectDir}/setup")
    def stagingInput = file("${buildDir}/tmp/deb-input")
    def version = project.hasProperty('version') ? project.version : "4.7.0"
    def arch = System.getProperty("os.arch") == "aarch64" ? "arm64" : "amd64"
    def outDebFile = file("${outputDir}/openintegrationengine_${version}-1_${arch}.deb")

    outputs.file(outDebFile)

    doFirst {
        outputDir.mkdirs()
        if (outDebFile.exists()) {
            outDebFile.delete()
        }
        delete stagingInput
        copy {
            from(setupDir)
            into(stagingInput)
            exclude 'distribution/**', '*.exe', '*.bat', '*.ps1', 'oieservice*'
        }
    }

    commandLine 'jpackage',
        '--type', 'deb',
        '--name', 'openintegrationengine',
        '--app-version', version,
        '--description', 'Open Integration Engine Server',
        '--vendor', 'OpenIntegrationEngine',
        '--input', setupDir.absolutePath,
        '--main-jar', 'mirth-server-launcher.jar',
        '--main-class', 'com.mirth.connect.server.launcher.MirthLauncher',
        '--dest', outputDir.absolutePath,
        '--install-dir', '/opt',
        '--resource-dir', resourcesDir.absolutePath,
        '--linux-package-name', 'openintegrationengine',
        '--linux-package-deps', 'openjdk-17-jre-headless',
        '--linux-deb-maintainer', 'admin@example.com',
        '--linux-app-category', 'misc',
        '--java-options', '-server -Xmx256m -Djava.awt.headless=true -Ddir.base=/opt/openintegrationengine/lib/app --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED'
    
    doLast {
        delete stagingInput
    }
}
// Generic Unix installer
tasks.register('distInstallerSh') {
    group = 'distribution'
    description = 'Generates a .sh autoexecutable installer universal for Linux'
    dependsOn 'prepareServerBundle'

    def setupDir = file("${project(':server').projectDir}/setup")
    def headerFile = file("${project(':server').projectDir}/distribution/linux/sh/installer.sh")
    def outputDir = layout.buildDirectory.dir("distributions").get().asFile
    def version    = (project.findProperty('version') && project.version != 'unspecified') ? project.version : "4.7.0"
    def finalSh = new File(outputDir, "oie-installer.sh")
    def tempTar = new File(layout.buildDirectory.asFile.get(), "temp-payload.tar.gz")

    outputs.file(finalSh)

    doLast {
        outputDir.mkdirs()
        tempTar.parentFile.mkdirs()

        // Create  tarball in temporary memory/disk
        ant.tar(destfile: tempTar, compression: 'gzip') {
            tarfileset(dir: setupDir) {
                exclude(name: 'distribution/**')
                exclude(name: '*.exe')
                exclude(name: '*.bat')
                exclude(name: '*.ps1')
                exclude(name: 'oieservice*')
                exclude(name: 'oieserver')
            }
            tarfileset(dir: setupDir, filemode: '755') {
                include(name: 'oieserver')
            }
        }

        // Join script shell with binary tar.gz
        finalSh.withOutputStream { out ->
            headerFile.withInputStream { ins -> out << ins }
            out << "\n"
            tempTar.withInputStream { ins -> out << ins }
        }

        // Add execution permits
        finalSh.setExecutable(true, false)
        tempTar.delete()
        
        println "Generated installer in: ${finalSh.absolutePath}"
    }
}


// WINDOWS INSTALLER
// Internal task: Downloads JRE
// 1. Download Windows JREs (x64 & aarch64)
def winJreArchs = [
    [name: 'X64',   apiArch: 'x64',     folder: 'jre-win-x64'],
    [name: 'Arm64', apiArch: 'aarch64', folder: 'jre-win-arm64']
]

winJreArchs.each { arch ->
    tasks.register("downloadWindows${arch.name}Jre") {
        def jreTargetDir = file("${buildDir}/${arch.folder}")
        def jreZip = file("${buildDir}/tmp/temurin-jre-win-${arch.apiArch}.zip")
        outputs.dir(jreTargetDir)

        doLast {
            if (!jreTargetDir.exists() || jreTargetDir.list().length == 0) {
                jreTargetDir.mkdirs()
                jreZip.parentFile.mkdirs()

                def downloadUrl = arch.apiArch == 'aarch64'
                    ? "https://download.bell-sw.com/java/17.0.13+12/bellsoft-jre17.0.13+12-windows-aarch64.zip"
                    : "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
                def currentUrl = new URL(downloadUrl)
                def connection = null
                for (int i = 0; i < 8; i++) {
                    connection = currentUrl.openConnection()
                    connection.setRequestProperty("User-Agent", "Gradle-Downloader")
                    connection.instanceFollowRedirects = false
                    int code = connection.responseCode
                    if (code in [301, 302, 307, 308]) {
                        currentUrl = new URL(connection.getHeaderField("Location"))
                    } else if (code == 200) {
                        break
                    } else {
                        throw new GradleException("Unexpected HTTP ${code} downloading Windows ${arch.apiArch} JRE")
                    }
                }
                jreZip.withOutputStream { it << connection.inputStream }

                copy {
                    from zipTree(jreZip)
                    into jreTargetDir
                    eachFile { fcd -> fcd.path = fcd.path.replaceFirst("^[^/]+/", "") }
                    includeEmptyDirs = false
                }
                jreZip.delete()
            }
        }
    }
}

// 2. Define the 4 Windows .exe installers matching install4j IDs (27, 121, 119, 136)
def winInstallerVariants = [
    [name: 'X64NoJre',     platform: 'windows-x64',   jreFolder: null,            jreTask: null,                    winsw: 'WinSW-x64.exe',   suffix: ''],
    [name: 'X64WithJre',   platform: 'windows-x64',   jreFolder: 'jre-win-x64',   jreTask: 'downloadWindowsX64Jre',   winsw: 'WinSW-x64.exe',   suffix: '-with-JRE'],
    [name: 'Arm64NoJre',   platform: 'windows-arm64', jreFolder: null,            jreTask: null,                    winsw: 'WinSW-arm64.exe', suffix: ''],
    [name: 'Arm64WithJre', platform: 'windows-arm64', jreFolder: 'jre-win-arm64', jreTask: 'downloadWindowsArm64Jre', winsw: 'WinSW-arm64.exe', suffix: '-with-JRE']
]

winInstallerVariants.each { variant ->
    tasks.register("distWindows${variant.name}") {
        group = 'distribution'
        dependsOn 'prepareServerBundle'
        if (variant.jreTask) dependsOn variant.jreTask

        def serverDir = project(':server').projectDir
        def winDistDir = file("${buildDir}/win-staging-${variant.name}")
        def finalDistDir = file("${buildDir}/distributions")
        def baseFileName = "oie_${variant.platform}_${project.version}${variant.suffix}"

        doLast {
            winDistDir.deleteDir()
            winDistDir.mkdirs()
            finalDistDir.mkdirs()

            copy { from "${serverDir}/setup"; into winDistDir }

            if (variant.jreFolder) {
                copy { from file("${buildDir}/${variant.jreFolder}"); into "${winDistDir}/jre" }
            }

            copy { from "${serverDir}/distribution/windows/oieservice.xml"; into winDistDir }
            copy { from "${serverDir}/distribution/windows/installer.iss"; into winDistDir }

            //If it has an embedded JRE use java.exe directly
            if (variant.jreFolder) {
                def serviceXml = file("${winDistDir}/oieservice.xml")
                serviceXml.text = serviceXml.text.replace(
                    '<executable>java</executable>',
                    '<executable>%BASE%\\jre\\bin\\java.exe</executable>'
                )
            }

            // Generate oiecommand.bat
            file("${winDistDir}/oiecommand.bat").text = '''@echo off
                setlocal
                set "DIR_BASE=%~dp0"
                set "JAVA_CMD=java"
                if exist "%DIR_BASE%jre\\bin\\java.exe" (
                    set "JAVA_CMD=%DIR_BASE%jre\\bin\\java.exe"
                )
                pushd "%DIR_BASE%"
                "%JAVA_CMD%" -jar "%DIR_BASE%mirth-cli-launcher.jar" %*
                popd
                '''

            ant.get(
                src: "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe",
                dest: file("${winDistDir}/oieservice.exe"),
                skipexisting: true
            )

            file("${winDistDir}/installer").mkdirs()
            project.ant.chmod(dir: winDistDir, perm: '777', type: 'both', includes: '**/*')
            project.ant.chmod(dir: winDistDir, perm: '777')

            exec {
                commandLine 'docker', 'run', '--rm',
                            '-v', "${winDistDir.absolutePath}:/work",
                            'amake/innosetup',
                            "/DOutputBaseFilename=${baseFileName}",
                            "/DIncludeJre=${variant.jreFolder != null}",
                            'installer.iss'
            }

            copy {
                from "${winDistDir}/installer/${baseFileName}.exe"
                into finalDistDir
            }
            winDistDir.deleteDir()
        }
    }
}

// 3. Define the 2 Windows .zip archives matching install4j IDs (153, 167)
['windows-x64', 'windows-arm64'].each { plat ->
    def capPlat = plat == 'windows-x64' ? 'X64' : 'Arm64'
    tasks.register("distWindows${capPlat}Archive", Zip) {
        group = 'distribution'
        dependsOn 'prepareServerBundle'
        archiveFileName = "oie_${plat}_${project.version}.zip"
        destinationDirectory = file("${buildDir}/distributions")
        from("${project(':server').projectDir}/setup") {
            into "OpenIntegrationEngine"
        }
    }
}
tasks.register('distWindows') {
    group = 'distribution'
    description = 'Generates the 4 Windows installers (.exe) and 2 archives (.zip) defined in install4j.'
    dependsOn 'distWindowsX64NoJre',
              'distWindowsX64WithJre',
              'distWindowsX64Archive',
              'distWindowsArm64NoJre',
              'distWindowsArm64WithJre',
              'distWindowsArm64Archive'
}

// MACOS (APPLE SILICON aarch64 + INTEL x64)
def appShortName = "oie"
def appVersion   = project.findProperty('version') && project.version != 'unspecified' ? project.version : "4.7.0"

// Downloads 2 JREs (one for each architecture)
def macJreArchs = [
    [name: 'Arm64', apiArch: 'aarch64'],
    [name: 'X64',   apiArch: 'x64']
]

macJreArchs.each { arch ->
    def jreTargetDir = file("${buildDir}/jre-mac-${arch.apiArch}")
    def jreTarGz     = file("${buildDir}/tmp/temurin-jre-mac-${arch.apiArch}.tar.gz")

    tasks.register("downloadMac${arch.name}Jre") {
        outputs.dir(jreTargetDir)
        doLast {
            if (!file("${jreTargetDir}/bin/java").exists()) {
                jreTargetDir.mkdirs()
                jreTarGz.parentFile.mkdirs()

                def currentUrl = "https://api.adoptium.net/v3/binary/latest/17/ga/mac/${arch.apiArch}/jre/hotspot/normal/eclipse?project=jdk"
                def connection = null
                for (int i = 0; i < 8; i++) {
                    connection = new URL(currentUrl).openConnection()
                    connection.setRequestProperty("User-Agent", "Gradle-Downloader")
                    connection.instanceFollowRedirects = false
                    if (connection.responseCode in [301, 302, 307, 308]) {
                        currentUrl = connection.getHeaderField("Location")
                    } else if (connection.responseCode == 200) {
                        break
                    } else {
                        throw new GradleException("Error HTTP ${connection.responseCode} descargando JRE macOS (${arch.apiArch})")
                    }
                }
                jreTarGz.withOutputStream { it << connection.inputStream }

                copy {
                    from tarTree(resources.gzip(jreTarGz))
                    into jreTargetDir
                    eachFile { fcd ->
                        fcd.path = fcd.path.replaceFirst("^[^/]+/Contents/Home/", "")
                    }
                    includeEmptyDirs = false
                }
                jreTarGz.delete()
            }
        }
    }
}

// For variants defined in og install4j -> generates final .dmg installers (IDs 43, 130, 116, 133)
def macVariants = [
    [name: 'Arm64NoJre',   apiArch: 'aarch64', jreTask: null,                  suffix: 'aarch'],
    [name: 'Arm64WithJre', apiArch: 'aarch64', jreTask: 'downloadMacArm64Jre', suffix: 'aarch-with-JRE'],
    [name: 'X64NoJre',     apiArch: 'x64',     jreTask: null,                  suffix: 'x86'],
    [name: 'X64WithJre',   apiArch: 'x64',     jreTask: 'downloadMacX64Jre',   suffix: 'x86-with-JRE']
]

macVariants.each { variant ->
    def stagingRoot = file("${buildDir}/mac-staging-${variant.suffix}")
    def installDir  = file("${stagingRoot}/OpenIntegrationEngine")
    def stageDir    = file("${projectDir}/server/setup")
    def outDmg      = file("${buildDir}/distributions/${appShortName}_macos_${appVersion}-${variant.suffix}.dmg")

    tasks.register("distMac${variant.name}") {
        dependsOn 'prepareServerBundle'
        if (variant.jreTask) {
            dependsOn variant.jreTask
        }
        outputs.file(outDmg)

        doLast {
            delete stagingRoot
            installDir.mkdirs()

            // A) Copy content from server/setup
            copy {
                from(stageDir)
                into installDir
                exclude 'distribution/**', '*.exe', '*.bat', '*.ps1', 'oieservice*'
            }

            // B) If there is variant -with-JRE, embed corresponding runtime in /jre
            if (variant.jreTask) {
                copy {
                    from file("${buildDir}/jre-mac-${variant.apiArch}")
                    into "${installDir}/jre"
                }
                fileTree("${installDir}/jre/bin").each { it.setExecutable(true, false) }
                // Point oieserver directly to the bundled JRE via -java-cmd
                def vmOptionsFile = file("${installDir}/oieserver.vmoptions")
                if (vmOptionsFile.exists()) {
                    vmOptionsFile.append("\n-java-cmd jre/bin/java\n")
                }
            }
            // Generate oiecommand CLI wrapper (uses bundled JRE if present, else system java)
            def cliScript = file("${installDir}/oiecommand")
            cliScript.text = '''#!/usr/bin/env bash
            SCRIPT_PATH="$(readlink -f "$0" 2>/dev/null || realpath "$0" 2>/dev/null || echo "$0")"
            DIR_BASE="$(cd "$(dirname "$SCRIPT_PATH")" && pwd)"
            JAVA_CMD="java"
            if [ -x "$DIR_BASE/jre/bin/java" ]; then
                JAVA_CMD="$DIR_BASE/jre/bin/java"
            fi
            cd "$DIR_BASE"
            exec "$JAVA_CMD" -jar "$DIR_BASE/mirth-cli-launcher.jar" "$@"
            '''
            // Execution permission for starting scripts
            fileTree(installDir) { include '*.sh', 'oieserver', 'oiecommand' }.each { it.setExecutable(true, false) }

            // D) Generate image .dmg with root folder OpenIntegrationEngine/
            outDmg.parentFile.mkdirs()
            outDmg.delete()

            exec {
                commandLine 'genisoimage',
                    '-V', 'OpenIntegrationEngine',
                    '-D', '-R', '-apple', '-no-pad',
                    '-o', outDmg.absolutePath,
                    stagingRoot.absolutePath
            }

            println "Generated: ${outDmg.name}"
        }
    }
}

// Main task to generate 4 macOS .dmg
tasks.register('distMac') {
    dependsOn macVariants.collect { "distMac${it.name}" }
    description = 'Generates the 4 macOS installers (.dmg) defined in install4j.'
}
